events {}

http {
     log_format metrics '$status $request_time $upstream_addr';   # NEW
    access_log /dev/stdout metrics;                               # NEW

    server {
        listen 80;

        location / {
            resolver 127.0.0.11 valid=5s;
            set $backend http://model:8000;
            proxy_pass $backend;
        }
    }
}